[package]
name = "knapper"
version = "0.9.0"
edition = "2024"
description = "Local hybrid search and MCP retrieval for Obsidian-format vaults"
license = "MIT"
repository = "https://github.com/mightytribble/knapper"
homepage = "https://github.com/mightytribble/knapper"
readme = "README.md"
keywords = ["obsidian", "semantic-search", "mcp", "rag", "knowledge-graph"]
categories = ["command-line-utilities", "database", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "array"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
ureq = { version = "2.12", features = ["native-certs"] }
indicatif = "0.17"
dialoguer = "0.12"
console = "0.16"
regex = "1"
sqlite-vec = "0.1.8-alpha.1"
zerocopy = { version = "0.7", features = ["derive"] }
rayon = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
strsim = "0.11"
ignore = "0.4"
globset = "0.4"
rmcp = { version = "1.5", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net"] }
notify = "7.0"
notify-debouncer-full = "0.4"
libc = "0.2"
llama-cpp-2 = "0.1"
encoding_rs = "0.8"
shimmytok = "0.7"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tokio-util = "0.7"

[features]
default = []
# Compiles llama.cpp's CUDA backend. Deliberately out of `default`: it needs a
# CUDA toolkit on the box, and CI's macOS and Ubuntu legs have none. All three
# model loads already pass `LlamaModelParams::default()`, whose `n_gpu_layers`
# is -1 — every layer — so the offload happens with no source change here.
cuda = ["llama-cpp-2/cuda"]

[dev-dependencies]
tempfile = "3"
# Already in the dependency graph via axum's `Query` extractor (see
# Cargo.lock); declared directly so `params.rs` can test its GET-query-string
# shape without going through a live axum router (#62).
serde_urlencoded = "0.7"
