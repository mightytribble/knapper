name: CI

# Manual only. This is a private fork worked on from one machine, and the
# checks below all run locally in seconds — the hosted run bought nothing and
# billed for it, twice per push, with the macOS leg charged at 10x the minute
# rate. See FORK-NOTES.md "Building" for the local equivalent.
#
# Run it from the Actions tab, or `gh workflow run ci.yml`, when a change needs
# checking against macOS or a clean Ubuntu toolchain.
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --lib
