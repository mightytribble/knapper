name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.0)"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            archive: knapper-macos-arm64.tar.gz
          - os: ubuntu-latest
            archive: knapper-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Archive binary
        run: |
          cd target/release
          tar czf ../../${{ matrix.archive }} knapper
          cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.archive }}

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Compute source tarball SHA256
        id: sha
        run: |
          url="https://github.com/mightytribble/knapper/archive/refs/tags/${{ inputs.tag }}.tar.gz"
          sha=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mightytribble/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/knapper.rb << 'FORMULA'
          class Knapper < Formula
            desc "Local hybrid search and MCP retrieval for Obsidian-format vaults"
            homepage "https://github.com/mightytribble/knapper"
            url "https://github.com/mightytribble/knapper/archive/refs/tags/TAG.tar.gz"
            sha256 "SHA256"
            license "MIT"

            depends_on "cmake" => :build
            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "knapper", shell_output("#{bin}/knapper --help")
            end
          end
          FORMULA

          sed -i "s|TAG|${{ inputs.tag }}|g" Formula/knapper.rb
          sed -i "s|SHA256|${{ steps.sha.outputs.sha256 }}|g" Formula/knapper.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/knapper.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/knapper.rb
          git commit -m "Update knapper to ${{ inputs.tag }}"
          git push
