name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.0)"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            archive: knapper-macos-arm64.tar.gz
          - os: ubuntu-latest
            archive: knapper-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Archive binary
        run: |
          cd target/release
          tar czf ../../${{ matrix.archive }} knapper
          cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.archive }}

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Three artifacts: the two release binaries the formula installs
      # directly, and the source tarball the platforms without one build.
      - name: Compute artifact SHA256s
        id: sha
        run: |
          base=https://github.com/mightytribble/knapper
          rel="$base/releases/download/${{ inputs.tag }}"

          # -f matters here. Without it a missing asset hands its 404 page to
          # sha256sum, and the formula ships a hash of HTML that fails for
          # every user. With -f, pipefail turns that into a failed job.
          hash() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }

          src=$(hash "$base/archive/refs/tags/${{ inputs.tag }}.tar.gz")
          mac=$(hash "$rel/knapper-macos-arm64.tar.gz")
          lnx=$(hash "$rel/knapper-linux-x86_64.tar.gz")

          for h in "$src" "$mac" "$lnx"; do
            case "$h" in
              [0-9a-f]*) [ "${#h}" -eq 64 ] || { echo "::error::not a sha256: $h"; exit 1; } ;;
              *) echo "::error::not a sha256: $h"; exit 1 ;;
            esac
          done

          {
            echo "src=$src"
            echo "mac=$mac"
            echo "linux=$lnx"
          } >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mightytribble/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/knapper.rb << 'FORMULA'
          class Knapper < Formula
            desc "Local hybrid search and MCP retrieval for Obsidian-format vaults"
            homepage "https://github.com/mightytribble/knapper"
            license "MIT"
            version "@@VERSION@@"

            # Apple Silicon and Linux x86_64 install the released binary,
            # which links nothing outside the system libraries. Every other
            # platform builds from source, so no one loses an install path.
            on_macos do
              on_arm do
                url "https://github.com/mightytribble/knapper/releases/download/@@TAG@@/knapper-macos-arm64.tar.gz"
                sha256 "@@MAC_SHA@@"
              end
              on_intel do
                url "https://github.com/mightytribble/knapper/archive/refs/tags/@@TAG@@.tar.gz"
                sha256 "@@SRC_SHA@@"
                depends_on "cmake" => :build
                depends_on "rust" => :build
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/mightytribble/knapper/releases/download/@@TAG@@/knapper-linux-x86_64.tar.gz"
                sha256 "@@LINUX_SHA@@"
              end
              on_arm do
                url "https://github.com/mightytribble/knapper/archive/refs/tags/@@TAG@@.tar.gz"
                sha256 "@@SRC_SHA@@"
                depends_on "cmake" => :build
                depends_on "rust" => :build
              end
            end

            head do
              url "https://github.com/mightytribble/knapper.git", branch: "main"
              depends_on "cmake" => :build
              depends_on "rust" => :build
            end

            def install
              prebuilt = (OS.mac? && Hardware::CPU.arm?) || (OS.linux? && Hardware::CPU.intel?)
              if build.head? || !prebuilt
                system "cargo", "install", *std_cargo_args
              else
                bin.install "knapper"
              end
            end

            test do
              assert_match "knapper #{version}", shell_output("#{bin}/knapper --version")
            end
          end
          FORMULA

          # @@..@@ placeholders rather than bare words: a plain s|TAG|...|g
          # would also rewrite any occurrence of those letters in a URL.
          sed -i "s|@@TAG@@|${{ inputs.tag }}|g" Formula/knapper.rb
          sed -i "s|@@VERSION@@|${TAG#v}|g" Formula/knapper.rb
          sed -i "s|@@SRC_SHA@@|${{ steps.sha.outputs.src }}|g" Formula/knapper.rb
          sed -i "s|@@MAC_SHA@@|${{ steps.sha.outputs.mac }}|g" Formula/knapper.rb
          sed -i "s|@@LINUX_SHA@@|${{ steps.sha.outputs.linux }}|g" Formula/knapper.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/knapper.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/knapper.rb

          # A re-run of a release whose formula is already current stages
          # nothing, and `git commit` exits non-zero on an empty commit, which
          # under `bash -e` fails the job for no fault. Report and stop instead.
          if git diff --staged --quiet; then
            echo "Formula is already at ${{ inputs.tag }}; nothing to commit."
            exit 0
          fi

          git commit -m "Update knapper to ${{ inputs.tag }}"
          git push

  publish-images:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Image tags carry the bare version: the release tag is v0.9.1, the
      # image is 0.9.1-cpu.
      - name: Derive image version
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/login-action checks that credentials parse, not that they may
      # write, so a denied push surfaces only once the build is done — which
      # on the cuda leg is 46 minutes of compilation spent to learn nothing.
      # Ask the registry up front: opening a blob upload needs write access
      # and creates no tag, blob or manifest — only an upload session, which
      # ghcr will not let you cancel (it answers 405) and collects itself.
      - name: Probe registry write access
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          repo=mightytribble/knapper
          settings=https://github.com/users/mightytribble/packages/container/knapper/settings

          bearer=$(curl -sS -u "$ACTOR:$TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull,push" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))') || true
          if [ -z "$bearer" ]; then
            echo "::error::ghcr.io issued no push token for $repo."
            echo "Grant this repository the Write role under Manage Actions access: $settings"
            exit 1
          fi

          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $bearer" \
            "https://ghcr.io/v2/$repo/blobs/uploads/")
          if [ "$code" != "202" ]; then
            echo "::error::ghcr.io refused a write probe for $repo (HTTP $code)."
            echo "Grant this repository the Write role under Manage Actions access: $settings"
            exit 1
          fi

          # Best-effort cancel. ghcr answers 405 here and reclaims the
          # abandoned session on its own; nothing user-visible is created
          # either way, so the result is not worth failing the job over.
          loc=$(grep -i '^location:' "$headers" | tr -d '\r' | awk '{print $2}') || true
          case "$loc" in /*) loc="https://ghcr.io$loc" ;; esac
          if [ -n "$loc" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $bearer" "$loc" >/dev/null || true
          fi
          echo "Registry write access confirmed."

      # The cuda build unpacks a ~4 GB devel base and compiles llama.cpp for
      # five GPU architectures. A stock runner does not have room for that
      # beside the preinstalled toolchains it will never use.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VARIANT=${{ matrix.variant }}
          push: true
          # `latest` follows cpu alone: it is the variant that runs on any
          # host, and a bare `docker pull` should not land someone on an
          # image that needs a GPU driver. An empty line here is ignored,
          # which is how the cuda leg opts out.
          tags: |
            ghcr.io/mightytribble/knapper:${{ matrix.variant }}
            ghcr.io/mightytribble/knapper:${{ steps.ver.outputs.version }}-${{ matrix.variant }}
            ${{ matrix.variant == 'cpu' && 'ghcr.io/mightytribble/knapper:latest' || '' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Only the cpu image can be checked here: the cuda binary links -lcuda
      # against a driver that a GPU-less runner does not have, so a failure
      # would say nothing about the build.
      - name: Verify the pushed image runs
        if: matrix.variant == 'cpu'
        run: |
          docker run --rm \
            ghcr.io/mightytribble/knapper:${{ steps.ver.outputs.version }}-${{ matrix.variant }} \
            --version
